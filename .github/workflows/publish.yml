name: publish-queue
# PC가 게시 시간에 직접 실행(workflow_dispatch). 예약 시간이 지난 게시물만 올림.
on:
  # 2026-11-20: 15분 예약 실행 끔. PC 작업 스케줄러(publish_slot.py)가 게시 시간에 직접 실행함.
  # 되돌리려면 아래 두 줄의 주석을 푼다.
  # schedule:
  #   - cron: "*/15 0-14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-queue      # 동시에 두 번 실행되지 않게 (중복 게시 방지)
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ENABLED: ${{ vars.THREADS_ENABLED }}
        run: python publisher_ci/publish_queue.py
